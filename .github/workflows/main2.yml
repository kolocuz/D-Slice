name: Build Windows Only

on:
  workflow_dispatch: # Позволяет запускать кнопкой из вкладки Actions
  push:
    branches: [developmentalist] # Будет запускаться при пуше в эту ветку

jobs:
  BuildCaches:
    name: Caches
    permissions: write-all
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-latest
      CACHE_NAME: D-Slice.desktop-cache
      setupScript: sh ./setup/unix.sh

  BuildWindows:
    name: Windows
    needs: BuildCaches
    permissions: write-all
    uses: ./.github/workflows/build.yml
    with:
      name: Windows
      os: windows-2022
      buildArgs: windows
      exportPath: windows
      artifactName: D-Slice_windows
      artifactPath: export\release\windows\bin\*
      cachePath: D-Slice.build-windows
      cacheLibrariesPath: D-Slice.desktop-cache
