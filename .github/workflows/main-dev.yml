name: Build the game

on:
  push:
    branches: [ main-dev ]
  workflow_dispatch:

jobs:
  BuildCaches:
    name: Desktop Cache
    permissions: write-all
    uses: ./.github/workflows/dependencies.yml
    with:
      os: windows-2022
      CACHE_NAME: H-Slice+JS.desktop-cache
      setupScript: cmd /c "cd setup && call windows.bat"

  BuildDesktop:
    name: Windows
    needs: BuildCaches
    permissions: write-all
    uses: ./.github/workflows/build.yml
    with:
      name: Windows
      os: windows-2022
      buildArgs: windows
      exportPath: windows
      artifactName: H-Slice+JS_0.2.4_windows
      artifactPath: export\release\windows\bin\*
      cachePath: H-Slice+JS.build-windows
      cacheLibrariesPath: H-Slice+JS.desktop-cache
