name: Build the game

on:
  push:
    branches: [ main-dev ]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  BuildCaches:
    name: Setup Dependencies
    uses: ./.github/workflows/dependencies.yml
    with:
      CACHE_NAME: Windows-Cache
      os: windows-2022
      setupScript: cmd /c "cd setup && call windows.bat"

  BuildWindows:
    name: Windows
    needs: BuildCaches
    uses: ./.github/workflows/build.yml
    with:
      name: Windows
      os: windows-2022
      buildArgs: windows
      exportPath: windows
      artifactName: H-Slice+JS_windows
      artifactPath: export\release\windows\bin\*
      cachePath: Windows-Build-Cache
      cacheLibrariesPath: Windows-Cache
